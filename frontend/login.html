<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReUseMatch | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: 'Outfit', sans-serif;

            background: linear-gradient(
                135deg,
                #052e16,
                #166534,
                #22c55e
            );
        }

        .login-container {
            width: 400px;
            padding: 40px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 50px;
        }

        .logo h1 {
            margin-top: 8px;

            color: #166534;

            font-size: 30px;
            font-weight: 700;
        }

        .logo p {
            margin-top: 5px;

            color: #6b7280;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: #14532d;

            font-weight: 700;
        }

        .form-group input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #bbf7d0;
            border-radius: 9px;

            font-family: 'Outfit', sans-serif;
            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 9px;

            background: #16a34a;

            color: white;

            font-family: 'Outfit', sans-serif;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: #15803d;

            transform: translateY(-1px);
        }

        .message {
            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }

        .demo-info {
            margin-top: 25px;

            padding: 14px;

            background: #f0fdf4;

            border: 1px solid #bbf7d0;

            border-radius: 9px;

            text-align: center;

            color: #166534;

            font-size: 13px;
        }

        .demo-info strong {
            color: #14532d;
        }

        .footer-text {
            margin-top: 20px;

            text-align: center;

            color: #6b7280;

            font-size: 13px;
        }

        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- ReUseMatch Logo -->
        <div class="logo">

            <div class="logo-icon">
                🔄
            </div>

            <h1>
                ReUseMatch
            </h1>

            <p>
                Autonomous Circular Economy Platform
            </p>

        </div>


        <!-- Login Form -->
        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </form>


        <!-- Demo Login -->
        <div class="demo-info">

            <strong>Demo Login</strong>

            <br><br>

            Email:
            <strong>admin@reusematch.com</strong>

            <br>

            Password:
            <strong>123456</strong>

        </div>


        <div class="footer-text">
            ♻️ Building a sustainable future through reuse
        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");


                if (
                    email === "admin@reusematch.com" &&
                    password === "123456"
                ) {

                    message.style.color = "#16a34a";

                    message.textContent =
                        "Login successful!";


                    setTimeout(function() {

                        window.location.href = "index.html";

                    }, 800);

                }

                else {

                    message.style.color = "#dc2626";

                    message.textContent =
                        "Invalid email or password.";

                }

            });

    </script>

</body>
</html>
